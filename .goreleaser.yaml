version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: sendr
    main: ./main.go
    binary: sendr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # windows arm64 is rare — skip it
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/muhammedfazall/sendr-cli/cmd.version={{.Version}}

archives:
  - id: sendr
    # tar.gz for unix, zip for windows
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
